[project]
name = "seo-backlink-agent"
version = "0.1.0"
description = "White-hat SEO backlink acquisition agent"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.70"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seo-agent = "seo_agent.cli:main"

[tool.setuptools]
packages = ["seo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
